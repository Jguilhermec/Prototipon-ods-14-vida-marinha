<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guardiões da Maré Recife</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:#001522;
 font-family:Arial;
 touch-action:none;
}

#camera{
 width:100vw;
 height:100vh;
 overflow:hidden;
 position:relative;
}

#mapa{
 position:absolute;
 width:12000px;
 height:100vh;
 transition:.1s;
}


/* CÉU */

#ceu{
 position:absolute;
 width:12000px;
 height:42vh;
 background:linear-gradient(#081426,#344477,#ff7b55);
}

#sol{
 position:absolute;
 left:3500px;
 top:100px;
 width:150px;
 height:150px;
 border-radius:50%;
 background:#ffd86b;
 box-shadow:0 0 80px orange;
}


/* MAR */

#mar{
 position:absolute;
 top:42vh;
 width:12000px;
 height:58vh;
 background:linear-gradient(#00334a,#001018);
 overflow:hidden;
}


/* CIDADE */

.cidade{
 position:absolute;
 bottom:0;
 background:#102333;
}

.predio{
 bottom:0;
 position:absolute;
 background:#26384a;
}


/* BARCO */

#barco{
 position:absolute;
 top:-60px;
 left:500px;
 width:130px;
 z-index:20;
 animation:balanco 2s infinite;
}

@keyframes balanco{
50%{
 transform:translateY(5px) rotate(2deg)
}
}


#cabo{
 width:3px;
 height:0;
 background:white;
 position:absolute;
 left:65px;
 top:60px;
 transition:.3s;
}


/* LIXO */

.lixo{
 position:absolute;
 font-size:34px;
 animation:flutuar 3s infinite;
}

@keyframes flutuar{
50%{
 transform:translateY(-12px)
}
}


/* HUD */

#hud{
 position:fixed;
 top:15px;
 left:50%;
 transform:translateX(-50%);
 background:#001b29dd;
 color:white;
 padding:15px;
 border-radius:20px;
 width:90%;
 max-width:400px;
 z-index:50;
}

#barra{
 height:12px;
 background:#333;
 border-radius:20px;
 overflow:hidden;
}

#fill{
 height:100%;
 width:0%;
 background:#00e5ff;
}


/* CONTROLE */

#controle{
 position:fixed;
 bottom:20px;
 width:100%;
 display:flex;
 justify-content:space-between;
 padding:20px;
 z-index:60;
}

.btn{
 width:70px;
 height:70px;
 border-radius:50%;
 background:#082632;
 color:white;
 border:2px solid #00e5ff;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:30px;
}

</style>
</head>


<body>


<div id="camera">

<div id="mapa">


<div id="ceu">

<div id="sol"></div>


<div class="predio"
style="left:300px;width:150px;height:180px">
</div>

<div class="predio"
style="left:700px;width:220px;height:250px">
</div>

<div class="predio"
style="left:1200px;width:180px;height:210px">
</div>


</div>


<div id="mar">


<div id="barco">

<svg width="130" height="80">

<path d="M10 45 L120 45 L100 70 L30 70Z"
fill="#eee"/>

<path d="M35 40 L95 40 L80 15 L50 15Z"
fill="#00e5ff"/>

</svg>

<div id="cabo"></div>

</div>


</div>


</div>

</div>



<div id="hud">

🌊 Guardiões da Maré

<div id="contador">
0 / 200
</div>

<div id="barra">
<div id="fill"></div>
</div>

</div>



<div id="controle">

<div style="display:flex;gap:15px">

<div class="btn" id="left">◀</div>

<div class="btn" id="right">▶</div>

</div>


<div class="btn" id="acao">
⚡
</div>

</div>



<script>


const mapa=document.getElementById("mapa");
const barco=document.getElementById("barco");
const mar=document.getElementById("mar");
const cabo=document.getElementById("cabo");

let x=500;
let camera=0;

let total=200;
let coletados=0;

let pescando=false;



const lixoTipos=[
"🍼","🥫","🛞","📦",
"🛍️","🥤","🍾","👟",
"🔋","🛢️"
];


// cria lixo pelo mapa

for(let i=0;i<total;i++){

let l=document.createElement("div");

l.className="lixo";

l.innerHTML=
lixoTipos[
Math.floor(Math.random()*lixoTipos.length)
];


l.style.left=
(300+Math.random()*11000)+"px";


l.style.top=
(50+Math.random()*350)+"px";


mar.appendChild(l);

}



function atualizarCamera(){

let destino=x-innerWidth/2;

if(destino<0)
destino=0;


camera +=
(destino-camera)*0.08;


mapa.style.transform=
`translateX(${-camera}px)`;

}



function mover(v){

x+=v;


if(x<100)x=100;

if(x>11800)x=11800;


barco.style.left=x+"px";


atualizarCamera();

}// ============================
// PESCA
// ============================

function pescar(){

if(pescando) return;

pescando=true;

cabo.style.height="380px";


setTimeout(()=>{


document.querySelectorAll(".lixo")
.forEach(l=>{


let lx=parseInt(l.style.left);
let ly=parseInt(l.style.top);


if(
Math.abs(lx-(x+60))<80 &&
ly<430
){

l.remove();

coletados++;


document.getElementById("contador")
.innerHTML=
coletados+" / "+total;


document.getElementById("fill")
.style.width=
(coletados/total*100)+"%";



if(coletados>=total){

alert(
"🎉 Missão cumprida!\n\n"+
"Os Guardiões da Maré limparam o Recife!"
);

}

}



});


cabo.style.height="0px";


setTimeout(()=>{
pescando=false;
},300);


},400);

}



// ============================
// CONTROLES TECLADO
// ============================


document.addEventListener(
"keydown",
e=>{


if(
e.key=="ArrowRight" ||
e.key=="d" ||
e.key=="D"
)
mover(45);



if(
e.key=="ArrowLeft" ||
e.key=="a" ||
e.key=="A"
)
mover(-45);



if(
e.key=="f" ||
e.key=="F" ||
e.key==" "
)
pescar();



});




// ============================
// CONTROLES CELULAR
// ============================


document
.getElementById("left")
.onclick=()=>mover(-45);


document
.getElementById("right")
.onclick=()=>mover(45);


document
.getElementById("acao")
.onclick=pescar;



// ============================
// PARALLAX SIMPLES
// ============================


function animar(){

document.getElementById("ceu")
.style.transform=
`translateX(${-camera*0.25}px)`;


requestAnimationFrame(animar);

}

animar();



// ============================
// NOVO LIXO SURGINDO A FRENTE
// ============================


setInterval(()=>{


if(x>3000){

let l=document.createElement("div");

l.className="lixo";

l.innerHTML=
lixoTipos[
Math.floor(
Math.random()*lixoTipos.length
)
];


l.style.left=
(x+900+Math.random()*800)+"px";


l.style.top=
(80+Math.random()*300)+"px";


mar.appendChild(l);

}


},3000);



// ============================
// CENÁRIOS DO RECIFE
// ============================


function criarPonto(nome,posicao){

let placa=document.createElement("div");

placa.style.position="absolute";
placa.style.left=posicao+"px";
placa.style.top="100px";
placa.style.color="#00e5ff";
placa.style.fontSize="24px";
placa.style.fontWeight="bold";
placa.innerHTML=nome;


mar.appendChild(placa);

}


criarPonto(
"📍 Marco Zero",
500
);


criarPonto(
"🌉 Ponte Maurício de Nassau",
2200
);


criarPonto(
"🏛️ Recife Antigo",
4200
);


criarPonto(
"🌊 Boa Viagem",
7000
);


criarPonto(
"🌱 Manguezal",
9500
);



// ============================
// EXPANSÃO DO MAPA
// ============================

let tamanhoMapa=12000;


setInterval(()=>{


if(x>tamanhoMapa-2000){


tamanhoMapa+=3000;


mapa.style.width=
tamanhoMapa+"px";


for(let i=0;i<50;i++){

let l=document.createElement("div");

l.className="lixo";

l.innerHTML=
lixoTipos[
Math.floor(Math.random()*lixoTipos.length)
];


l.style.left=
(tamanhoMapa-2000+
Math.random()*2500)
+"px";


l.style.top=
(50+Math.random()*350)
+"px";


mar.appendChild(l);


}


}


},2000);




</script>


</body>
</html>
